#enemy_color : "red"
enemy_color: "blue"

#####-----Hero 节点专用（src/hero.cpp / HeroRosBoard / HeroSolver）-----
# 图像来自 ROS（默认话题见 hero -t）；姿态与弹速来自 communicate Autoaim。
hero_autoaim_topic: "/communicate/autoaim"
# true：不订阅 communicate，本地恒等姿态+auto_aim（无实机下位机）；false：正常订阅。亦可仅用 communicate 的 serial_enable:false 发假 Autoaim
hero_board_simulate_no_mcu: false
# true：关闭 ROS 图像 / Autoaim 「长时间未收到数据」的告警日志（故意阻塞 read、低速抽帧降开销时用）
hero_ros_suppress_rx_stall_log: false
# true：向 hero_link_node 入口发布 SerialInfo（默认 /communicate/vision_shoot_serial，须与包 hero_common 内 hero_link.yaml（源码 hero_common/hero_common/config）中 vision_serial_topic 一致）；由 hero_link_node mux 后发到 communicate /shoot_info，勿直连 shoot_info
hero_command_publish_enable: false
hero_command_topic: "/communicate/vision_shoot_serial"
# phoenix_angle_unit / imu_* / cboard_debug_log：HeroRosBoard 与串口 CBoard 共用同一套键名

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
rp24_model_path: assets/rp24_0526.onnx
device: CPU
min_confidence: 0.7
use_traditional: false
# true：使用 armor_detector 风格灯条检测（PhoenixTraditionDetector），优先级高于 --tradition
use_phoenix_traditional: false
# true 且实际走传统检测时：hero_detectwithpnp_test 中 imshow 二值化/调试图（binary_img、phoenix_*_binary、threshold 等）
debug_img: false

phoenix_tradition_detect:
  binary_threshold_red: 60
  binary_threshold_blue: 110
  light_contour_threshold_red: 60
  light_contour_threshold_blue: 110
  dilate_kernel_size: 5
  # 轮廓和单灯条门限
  min_contour_points: 10
  light_min_ratio: 1.3
  light_max_tilt_angle_deg: 35.0
  # 灯条配对几何门限
  pair_light_height_ratio_min: 0.8
  pair_light_height_ratio_max: 1.2
  pair_light_angle_diff_max_deg: 10.0
  pair_center_line_angle_max_deg: 30.0
  pair_center_distance_small_min: 0.8
  pair_center_distance_small_max: 3.2
  pair_center_distance_big_min: 3.2
  pair_center_distance_big_max: 5.5
  # 是否启用“中间夹灯条即拒绝”规则
  enable_contain_light_filter: true
  # 可视化分阶段开关
  viz_show_gray_binary: true
  viz_show_light_binary: true
  viz_show_light_boxes: true
  viz_show_accepted_armors: true
  viz_show_suspicious_armors: true
  # 可疑装甲板分阶段绘制开关
  viz_show_suspicious_geometry: false
  viz_show_suspicious_classify: true
  viz_show_suspicious_name_conf: true
  viz_show_suspicious_type: true
  viz_show_suspicious_reason_text: true
  viz_show_number_img: true
  # number_img 分阶段过滤（默认仅看分类拒绝）
  viz_show_number_img_geometry_reject: false
  viz_show_number_img_name_conf_reject: true
  viz_show_number_img_type_reject: true
  # 融合策略：传统角点优先；仅在 name/conf 失败时补跑 YOLO，用 YOLO 的 name/conf/type 兜底
  fuse_yolo_on_name_conf_reject: true
  fuse_match_center_max_px: 60.0
  fuse_min_yolo_confidence: 0.60
  # 角点一致性确认：YOLO 与传统角点偏差过大则丢弃该次兜底识别
  fuse_corner_mean_max_px: 28.0
  fuse_corner_max_px: 55.0
  # 可疑装甲板调试：被几何拒绝但分类器可识别编号
  suspicious_debug: false
  suspicious_min_confidence: 0.0
  # 装甲长宽比判定阈值（用于small/big划分）
  armor_ratio_big_threshold: 3.0
  armor_ratio_small_threshold: 2.5

#####-----ROI-----#####

roi: 
  x: 260
  y: 250
  width: 640
  height: 640

use_roi: true

dynamic_roi: false
dynamic_roi_shrink_frames: 2
dynamic_roi_lost_frames: 10

#####-----传统方法参数-----#####
threshold: 50
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 10
outpost_comming_angle: 70 # degree 前哨站进入视野角度
outpost_leaving_angle: 30 # degree 前哨站离开视野角度
# 前哨 temp_lost 最大容忍帧数；过小则略丢检即 lost（传统灯条比 YOLO 更易闪断）。其它车型 yaml 多为 75。
outpost_max_temp_lost_count: 10

#### -----装甲板跳变参数-----##### 注意要大于decision_speed才会补偿pitch角度
jump_yaw_threshold_deg: 35.0 # degree 非前哨站判定为"大yaw跳变"的阈值
jump_z_threshold: 0.07 # m 前哨站仍按z跳变判定
jump_confirm_count: 2
jump_avg_alpha: 0.8  # 越大当前观测值比重越大，受噪声的影响越大
jump_fire_cooldown: 0.01 # s 固定延时(不使用动态参数时生效)
outpost_jump_fire_cooldown: 0.05 # s 前哨站固定跳变发弹延时(不使用动态参数时生效)
jump_min_interval: 0.001 # s 跳变最小间隔
motion_state_enable: false # 是否启用运动状态判定，启用后会根据目标运动状态调整planner的参数
enable_imm: false  # 是否启用IMM，启用后会根据目标运动状态在多个卡尔曼滤波器间切换
motion_w_low: 5.0 # rad/s 角速度低阈值(滞回下边界)，用于区分慢速/快速旋转
motion_w_high: 10.0 # rad/s 角速度高阈值(滞回上边界)，高于此值更倾向判为快速旋转
motion_dw_high: 6.0 # rad/s^2 角加速度阈值，|dw|超过后更倾向判为变速旋转
imm_transition: [0.93, 0.05, 0.02, 0.04, 0.93, 0.03, 0.03, 0.07, 0.90] # 行优先3x3模型转移矩阵(行和应为1): slow/constant/variable
imm_r_yaw: 0.002 # IMM观测噪声R(yaw): 大=更平滑更滞后, 小=更跟随但更敏感
imm_q_slow: [1e-4, 8e-2, 1e-1] # slow模型过程噪声Q[yaw,w,alpha]
imm_q_constant: [1e-4, 2e-2, 5e-2] # constant模型过程噪声Q[yaw,w,alpha]
imm_q_variable: [2e-4, 2e-1, 8e-1] # variable模型过程噪声Q[yaw,w,alpha]，通常应最大
imm_alpha_decay_slow: 0.2 # slow模型下alpha衰减系数，越大角加速度回零越快
imm_alpha_decay_constant: 0.5 # constant模型下alpha衰减系数，常设高于slow以抑制伪加速度
imm_dt_min: 0.001 # s IMM时间步长下限，防止dt过小导致数值抖动
imm_dt_max: 0.2 # s IMM时间步长上限，防止掉帧后dt过大导致发散
# 目标过程噪声 角速度/线速度 (Q越大，越依赖观测值)
target_process_noise_linear_normal: 100.0  #100
target_process_noise_angular_normal: 200.0  #400
target_process_noise_linear_outpost: 10.0
target_process_noise_angular_outpost: 0.1
# 目标测量噪声 (R越大，越依赖预测值，更平滑，但是会更加滞后)
target_measurement_noise_yaw: 0.002    #0.002
target_measurement_noise_pitch: 0.002
# 目标匹配门控阈值（马氏距离平方 d^2）
target_match_gate_tracked: 12.0
target_match_gate_init: 24.0
force_target_angular_velocity: false    # 只针对非前哨站目标生效，启用后会强制使用下面的角速度（rad/s），会把
forced_target_angular_velocity: 2.51 # rad/s

#####-----aimer参数-----#####
yaw_offset: 0.075   # 增大向左，反之向右
pitch_offset: -1.0 # 增大向上 反之向下
comming_angle: 55 # degree 55
leaving_angle: 20 # degree 20
comming_angle_high: 30 # degree 高速(角速度大)使用
leaving_angle_high: 5 # degree 高速(角速度大)使用
comming_end_angle: 5 # degree 极高速下的最小角度
leaving_end_angle: 3 # degree 极高速下的最小角度
speed_angle: 8 # rad/s 角速度阈值(用于comming/leaving切换)
speed_angle_max: 11 # rad/s 达到该角速度时角度缩减到end_angle
decision_speed: 9 # rad/s
use_center_aim_when_high_speed: true # 高于decision_speed时yaw是否切换为瞄准车心(false则保持原先装甲板跟随)

#####-----auto aim fsm参数-----#####
auto_aim_fsm:
  enable: false
  transfer_thresh: 8      # 连续计数阈值，越大切换越稳但更慢
  # rad/s 
  single_whole_up: 2.5    # SINGLE -> WHOLE_CAR_ARMOR 上行阈值
  single_whole_down: 1.8  # WHOLE_CAR_ARMOR -> SINGLE 下行阈值
  whole_pair_up: 5.5      # WHOLE_CAR_ARMOR -> WHOLE_CAR_PAIR 上行阈值
  whole_pair_down: 4.5    # WHOLE_CAR_PAIR -> WHOLE_CAR_ARMOR 下行阈值
  pair_center_up: 8.0     # WHOLE_CAR_PAIR -> WHOLE_CAR_CENTER 上行阈值
  pair_center_down: 6.5   # WHOLE_CAR_CENTER -> WHOLE_CAR_PAIR 下行阈值

high_speed_delay_time: -0.05 # s
low_speed_delay_time: -0.08 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# Hero 主流程不用 mindvision；以下为兼容其它模块/标定习惯的占位，可不接物理相机
camera_name: "mindvision"
exposure_ms: 7.0
gamma: 1.0
gain: 400.0
vid_pid: "f622:d132"


R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

camera_matrix: [6423.9,0.0,708.1259,0.0,6413.7,472.7791,0.0,0.0,1.0]
distort_coeffs: [-0.0035,-0.6875,-0.0039,0.0024,0.0]

R_camera2gimbal: [0, 0, 1, -1, 0, 0,0,-1,0]
t_camera2gimbal: [0.0, 0.0, 0.0]  #0.10 0.07 0.10
# PnP 装甲中心距离修正：在解算得到的云台系位置向量长度上增加该值（m）；负值缩短。0 关闭
pnp_err_offset: 0.0

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"
phoenix_angle_unit: rad   # 下位机若发送角度(度)则设为deg，发送弧度则改为rad
imu_yaw_offset_deg: 0.0   # IMU偏置补偿，单位degree
imu_pitch_offset_deg: 0.0 # IMU偏置补偿，单位degree
use_default_bullet_speed: false # Hero：优先用 Autoaim 中 low_gimbal_yaw 弹速；true 则锁 yaml bullet_speed
cboard_debug_log: false    # 排障时设true，打印原始/解析后的下位机数据
use_identity_pose: false  # 是否使用单位四元数作为云台姿态（调试用）

#####-----目标稳定性参数-----#####
target_jump_angle_threshold_deg: 1.0   # 判定为"大跳变"的角度阈值（度），超过此值则平滑过渡
target_stabilize_alpha: 0.3            # 平滑系数(0.0~1.0)，越小越平滑(推荐0.1~0.5)，0表示完全保持上一值，1表示完全新值
enable_target_stabilize: false          # 是否启用平滑过渡机制

#####-----plotter参数-----#####
plotter_host: "127.0.0.1"
plotter_port: 9870

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035
# R越大越平滑/Q越大越激进
max_yaw_acc: 100
Q_yaw: [9e6,1e3]   # [角度误差惩罚, 角速度误差惩罚]
R_yaw: [1]

max_pitch_acc: 50
Q_pitch: [9e6,1e3]   # [角度误差惩罚, 角速度误差惩罚]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

bullet_speed: 12.0  # m/s